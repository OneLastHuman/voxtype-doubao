[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtype-doubao"
version = "0.1.0"
description = "OpenAI-compatible proxy for the free Doubao web ASR service, designed for voxtype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "voxtype-doubao contributors" }]
keywords = ["voxtype", "doubao", "asr", "speech-to-text", "openai", "wayland"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["websockets>=12.0"]

[project.optional-dependencies]
login = ["PyGObject>=3.48"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
voxtype-doubao = "voxtype_doubao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
